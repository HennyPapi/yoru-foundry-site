body{margin:0;background:var(--cast);color:var(--bright);font-family:var(--font-body)}
.page-end{max-width:var(--max);margin:0 auto;padding:80px 24px;color:var(--pewter)}
.kb-foot{border-top:var(--border-width) solid var(--line);padding:40px 24px 36px}
.kb{position:relative;max-width:1180px;margin:0 auto;aspect-ratio:2353/949}
.kb>img{display:block;width:100%;height:auto}
.kb a img{position:absolute;opacity:0;pointer-events:none}
.kb a .hit{position:absolute;border-radius:6px}
.kb a:hover img.h,.kb a:focus-visible img.h{opacity:1}
.kb a:active img.h{opacity:0}.kb a:active img.p{opacity:1}
.kb a:focus-visible .hit{outline:2px solid var(--raw-copper);outline-offset:2px}
.kb-line{max-width:1180px;margin:18px auto 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:var(--step-3);color:var(--pewter)}
.kb-line a{color:var(--bright);text-decoration-color:var(--raw-copper);text-underline-offset:3px}
</style></head><body>
