<title>Keyboard footer</title>
<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Cinzel:wght@400..900&family=Alegreya:ital,wght@0,400..800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
/* Mockup only: footer as a rendered 75% keyboard. Links are spelled on the keys; a word presses as one.
   The linked keys' copper underglow rises once (2.6s) when the board comes into view, like the header keys. */
body{margin:0;background:var(--cast);color:var(--bright);font-family:var(--font-body)}
.page-end{max-width:var(--max);margin:0 auto;padding:80px 24px 900px;color:var(--pewter)}
.kb-foot{border-top:var(--border-width) solid var(--line);padding:40px 24px 36px}
.kb{position:relative;max-width:1180px;margin:0 auto;aspect-ratio:2353/949}
.kb>img{display:block;width:100%;height:auto}
.kb>img.lit{position:absolute;inset:0;opacity:0;transition:opacity 2.6s ease}
.kb.is-lit>img.lit{opacity:1}
.kb a img{position:absolute;opacity:0;pointer-events:none}
.kb a .hit{position:absolute;border-radius:6px}
.kb a:hover img.h,.kb a:focus-visible img.h{opacity:1}
.kb a:active img.h{opacity:0}.kb a:active img.p{opacity:1}
.kb a:focus-visible .hit{outline:2px solid var(--raw-copper);outline-offset:2px}
.kb-list{display:none}
.kb-line{max-width:1180px;margin:18px auto 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:var(--step-3);color:var(--pewter)}
.kb-line a{color:var(--bright);text-decoration-color:var(--raw-copper);text-underline-offset:3px}
@media(max-width:700px){
 .kb a{display:none}                     /* phone: the board is a picture; the links are the list below */
 .kb-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;list-style:none;margin:22px 0 0;padding:0}
 .kb-list a{font-family:var(--font-display);font-weight:600;font-size:var(--step-3);color:var(--bright);text-decoration:underline;text-decoration-color:var(--raw-copper);text-underline-offset:4px}
}
@media(prefers-reduced-motion:reduce){.kb>img.lit{transition:none}}
</style></head><body>

<script>
// light the linked keys once when the board is mostly in view (at once with reduced motion or no observer)
const kb=document.querySelector(".kb");
if(matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window))kb.classList.add("is-lit");
else new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){kb.classList.add("is-lit");o.disconnect()}},{threshold:.5}).observe(kb);
</script>
