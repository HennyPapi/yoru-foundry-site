<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// Braided USB-C cable pieces for the header (units: mm), lit and viewed like the keycaps but through an
// orthographic camera, so a straight run looks identical at every x and tiles seamlessly.
// Pieces: 'tile' (straight run, a whole number of braid periods wide), 'coil' (pigtail coil with metal
// collars at both ends to hide the joins), 'plug' (strain relief, housing, USB-C shell pointing right).
const PX = 15;                                  // render px per mm (4x the header's CSS scale)
const H = 480, W = 1600;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.5 }));
ground.receiveShadow = true; scene.add(ground);
const key = new THREE.DirectionalLight(0xfff1e2, 2.3); key.position.set(-45, 30, 80); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 6; key.shadow.blurSamples = 16; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -70, right: 70, top: 40, bottom: -40, near: 1, far: 300 });
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.45); fill.position.set(60, -20, 40); scene.add(fill);
const front = new THREE.DirectionalLight(0xffe9d6, 0.9); front.position.set(-10, -90, 22); scene.add(front);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

// same viewing direction as the keycap camera
const dir = new THREE.Vector3(0, 0.6, 3.6).sub(new THREE.Vector3(0, -60, 92)).normalize();
const camera = new THREE.OrthographicCamera(-W / 2 / PX, W / 2 / PX, H / 2 / PX, -H / 2 / PX, 1, 1000);
camera.up.set(0, 0, 1);
camera.position.copy(new THREE.Vector3(0, 0, 2.3).addScaledVector(dir, -200)); camera.lookAt(0, 0, 2.3);

// braid: two strand families at 45 degrees, over-under, one copper tracer; one texture tile = one period
const R = 2.3, P = 4;                            // cable radius, braid period along the cable
function braid(base, tracer) {
  const w = 256, h = 1024, c = document.createElement('canvas'); c.width = w; c.height = h;
  const hex = s => ({ r: parseInt(s.slice(1, 3), 16) / 255, g: parseInt(s.slice(3, 5), 16) / 255, b: parseInt(s.slice(5, 7), 16) / 255 });  // sRGB as drawn, no linear conversion
  const g = c.getContext('2d'), im = g.createImageData(w, h), b = hex(base), t = hex(tracer);
  const hc = document.createElement('canvas'); hc.width = w; hc.height = h; const hg = hc.getContext('2d'), him = hg.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = x / w, cy = (y % 256) / 256, s1 = (a + cy) % 1, s2 = ((a - cy) % 1 + 1) % 1;
    const i1 = Math.floor(s1 * 2), i2 = Math.floor(s2 * 2), t1 = s1 * 2 % 1, t2 = s2 * 2 % 1;
    const top1 = (i1 + i2) % 2 === 0, tt = top1 ? t1 : t2;
    const fib = 0.9 + 0.1 * Math.sin((top1 ? s2 : s1) * Math.PI * 2 * 24);        // fibres across the strand
    const lum = (0.45 + 0.55 * Math.sin(Math.PI * tt)) * fib;
    const col = top1 && i1 === 0 && Math.floor(y / 256) === 0 ? t : b;
    const k = (y * w + x) * 4;
    im.data[k] = col.r * 255 * lum; im.data[k + 1] = col.g * 255 * lum; im.data[k + 2] = col.b * 255 * lum; im.data[k + 3] = 255;
    him.data[k] = him.data[k + 1] = him.data[k + 2] = 255 * Math.sin(Math.PI * tt) * fib; him.data[k + 3] = 255;
  }
  g.putImageData(im, 0, 0); hg.putImageData(him, 0, 0);
  const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace;
  const bump = new THREE.CanvasTexture(hc);
  for (const tx of [map, bump]) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.anisotropy = 8; }
  return { map, bump };
}
function cableMesh(curve, tex, segs) {
  const len = curve.getLength(), geo = new THREE.TubeGeometry(curve, segs, R, 32, false);
  const reps = Math.max(1, Math.round(len / P));  // whole periods, so the braid phase is 0 at both ends
  const map = tex.map.clone(), bump = tex.bump.clone(); map.repeat.set(reps, 1); bump.repeat.set(reps, 1);
  map.needsUpdate = bump.needsUpdate = true;
  const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ map, bumpMap: bump, bumpScale: 1.2, roughness: 0.7, sheen: 0.4, sheenRoughness: 0.6, sheenColor: new THREE.Color(0x8a9692) }));
  m.castShadow = m.receiveShadow = true; return m;
}
const metal = (color, rough = 0.35) => new THREE.MeshPhysicalMaterial({ color, metalness: 1, roughness: rough });
function along(geo) { geo.rotateZ(-Math.PI / 2); return geo; }       // cylinders along +x
function piece(mesh, x, z = R) { mesh.position.set(x, 0, z); mesh.castShadow = mesh.receiveShadow = true; return mesh; }

const group = new THREE.Group(); scene.add(group);
window.renderPiece = async ({ name, braidColor, tracer, collar, housing }) => {
  group.clear();
  const tex = braid(braidColor, tracer);
  let x0, x1;                                   // crop span in mm
  if (name === 'tile') {
    // a long straight run; the crop window starts a whole number of periods from the tube start
    group.add(cableMesh(new THREE.LineCurve3(new THREE.Vector3(-60, 0, R), new THREE.Vector3(60, 0, R)), tex, 60));
    x0 = -60 + 11 * P; x1 = x0 + 8 * P;
  } else if (name === 'coil') {
    const turns = 6, pitch = 5.0, CR = 4.4, lead = 5, pts = [];
    const span = turns * pitch, start = -span / 2 - lead;
    pts.push(new THREE.Vector3(start, 0, R), new THREE.Vector3(start + lead * 0.6, 0, R));
    for (let i = 0; i <= turns * 48; i++) {
      const th = i / 48 * Math.PI * 2, x = -span / 2 + th / (Math.PI * 2) * pitch;
      pts.push(new THREE.Vector3(x, -CR * Math.sin(th), R + CR - CR * Math.cos(th)));
    }
    pts.push(new THREE.Vector3(span / 2 + lead * 0.4, 0, R), new THREE.Vector3(span / 2 + lead, 0, R));
    window.coilCurve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    window.coilAxisZ = R + CR;
    group.add(cableMesh(window.coilCurve, tex, 900));
    for (const sx of [-1, 1]) {
      const c = piece(new THREE.Mesh(along(new THREE.CylinderGeometry(R + 0.55, R + 0.55, 5, 40)), metal(collar)), sx * (span / 2 + lead - 2.5), R);
      group.add(c);
    }
    x0 = start; x1 = span / 2 + lead;
  } else {                                      // plug, pointing right
    const lead = 2;
    group.add(cableMesh(new THREE.LineCurve3(new THREE.Vector3(-lead, 0, R), new THREE.Vector3(1, 0, R)), tex, 4));
    group.add(piece(new THREE.Mesh(along(new THREE.CylinderGeometry(R + 0.7, R + 0.25, 6, 40)), metal(collar)), 3));
    const body = piece(new THREE.Mesh(new RoundedBoxGeometry(15, 8.2, 5.2, 4, 1.6), metal(housing, 0.4)), 13.5, 2.75);
    group.add(body);
    group.add(piece(new THREE.Mesh(new RoundedBoxGeometry(6.6, 8.3, 2.5, 4, 1.1), metal(0x8e9794, 0.45)), 24, 2.75));
    x0 = -lead; x1 = 27.3;
  }
  renderer.render(scene, camera);
  const sx = v => Math.round((v.clone().project(camera).x + 1) / 2 * W);
  const sy = v => Math.round((1 - v.clone().project(camera).y) / 2 * H);
  // the coil's centreline on screen, with whether each point is on the near side of the coil (for LED beads)
  const path = name === 'coil' ? window.coilCurve.getSpacedPoints(600).map(p => [sx(p), sy(p), +(p.clone().sub(new THREE.Vector3(p.x, 0, window.coilAxisZ)).dot(dir) < 0.5)]) : null;
  window.lastSpan = { path, x0: sx(new THREE.Vector3(x0, 0, R)), x1: sx(new THREE.Vector3(x1, 0, R)), groundY: sy(new THREE.Vector3(0, 0, 0)), axisY: sy(new THREE.Vector3(0, 0, R)) };
  return renderer.domElement.toDataURL('image/png');
};
// where the plate (ground at depth 0) lands in a keycap render, for lining the cable up with the keys
const kc = new THREE.PerspectiveCamera(14.5, 1632 / 720, 1, 1000); kc.up.set(0, 0, 1);
kc.position.set(0, -60, 92); kc.lookAt(0, 0.6, 3.6); kc.updateMatrixWorld();
window.keyGroundY = Math.round((1 - new THREE.Vector3(0, 0, 0).project(kc).y) / 2 * 720);
window.keyPxPerMm = (new THREE.Vector3(10, 0, 0).project(kc).x - new THREE.Vector3(-10, 0, 0).project(kc).x) / 2 * 1632 / 20;
window.ready = true;
</script>
</body>
</html>
