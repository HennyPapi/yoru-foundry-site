<script type="module">

const bump = grain(256);
const LED = '#E8834D';
function glowTex(u) { const w = 256 * (u * P + 6) / (P + 6), h = 256, c = document.createElement('canvas'); c.width = Math.round(w); c.height = h; const g = c.getContext('2d');

  gr.addColorStop(0, '#000'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, 4, 64); return new THREE.CanvasTexture(c); })();
// legend: {big:"J"} centred letter, {small:"Tab"} top-left small, {lines:["Trust the","Process"]} centred lines

    lg.lines.forEach((l, i) => g.fillText(l, c.width / 2, c.height / 2 + (i - (n - 1) / 2) * lh + 10)); }
  if (lg.dir) { g.strokeStyle = ink; g.lineWidth = 22; g.lineCap = 'round'; g.lineJoin = 'round'; g.save(); g.translate(c.width / 2, c.height / 2 + 8);
    g.rotate({ up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[lg.dir]); g.beginPath(); g.moveTo(0, 95); g.lineTo(0, -95); g.moveTo(-60, -35); g.lineTo(0, -95); g.lineTo(60, -35); g.stroke(); g.restore(); }
  if (lg.arrow) { g.strokeStyle = ink; g.lineWidth = 18; g.lineCap = 'round'; g.lineJoin = 'round'; const ax = c.width - 120, ay = c.height - 130;
    g.beginPath(); g.moveTo(ax, ay - 130); g.lineTo(ax, ay); g.lineTo(ax - 210, ay); g.moveTo(ax - 155, ay - 55); g.lineTo(ax - 210, ay); g.lineTo(ax - 155, ay + 55); g.stroke(); }

const clip = [new THREE.Plane(new THREE.Vector3(0, 0, 1), 0)];
const keys = {};
window.build = async (layout) => {
  await document.fonts.load('700 100px Cinzel');
  const totalU = 16, rowsY = layout.rows.map((r, i) => -(i * P + (i > 0 ? 0.25 * P : 0)));
  const midY = (rowsY[0] + rowsY[rowsY.length - 1]) / 2;
  layout.rows.forEach((row, ri) => { let x = -totalU * P / 2;
    for (const k of row) { const u = k.u || 1, { wallGeo, topGeo, T } = capGeo(u), face = k.face || layout.face, ink = k.ink || layout.ink;
      const mat = new THREE.MeshPhysicalMaterial({ color: face, roughness: 0.5, bumpMap: bump, bumpScale: 0.6, sheen: 0.25, sheenRoughness: 0.8, sheenColor: new THREE.Color(face), clippingPlanes: clip, clipShadows: true });
      const topMat = mat.clone(); topMat.color = new THREE.Color(0xffffff); topMat.map = legendTex(T, face, ink, k.lg || {});
      if (k.id) { topMat.emissiveMap = legendTex(T, face, ink, k.lg || {}, true); topMat.emissive = new THREE.Color(LED); topMat.emissiveIntensity = 0;
        if (k.id === 'commission') topMat.emissiveMap = null, topMat.emissive = new THREE.Color(0);   // copper cap: keep its dark legend

const key = new THREE.DirectionalLight(0xfff1e2, 2.3); key.position.set(-160, 120, 300); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 7; key.shadow.blurSamples = 16; key.shadow.bias = -0.0003;
Object.assign(key.shadow.camera, { left: -260, right: 260, top: 200, bottom: -200, near: 1, far: 900 }); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.45); fill.position.set(200, -80, 160); scene.add(fill);
const front = new THREE.DirectionalLight(0xffe9d6, 0.9); front.position.set(-40, -330, 90); scene.add(front);

camera.position.set(0, -430, 640); camera.lookAt(0, 6, 0);
window.renderBoard = ({ pressed = {}, lit = 0, boost = {} } = {}) => {
  for (const [id, list] of Object.entries(keys)) for (const k of list) { k.grp.position.z = -(pressed[id] || 0); const b = lit * (boost[id] || 1);

    for (const k of list) for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
