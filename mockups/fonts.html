<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoru Foundry: font studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Grenze+Gotisch:wght@500..800&family=Alegreya:wght@400..700&family=Alegreya+Sans:wght@500;700&family=Big+Shoulders+Display:wght@600..900&family=Big+Shoulders+Text:wght@500..800&family=Marcellus&family=Marcellus+SC&family=Texturina:opsz,wght@12..72,400..800&family=EB+Garamond:wght@400..700&family=Barlow+Condensed:wght@500;600;700&family=Grenze:wght@500..800&family=Pirata+One&family=UnifrakturMaguntia&family=Uncial+Antiqua&family=Jacquard+24&family=IM+Fell+English&family=Almendra:wght@400;700&family=UnifrakturCook:wght@700&family=New+Rocker&family=Jacquard+12&family=Jacquarda+Bastarda+9&family=IM+Fell+French+Canon&family=IM+Fell+DW+Pica&family=Goudy+Bookletter+1911&family=Sorts+Mill+Goudy&family=Fruktur&family=Blaka&family=Jacquard+24+Charted&family=Metal+Mania&family=Caudex:wght@400;700&family=Brygada+1918:wght@400..700&family=Fondamento&family=IM+Fell+Great+Primer&family=Tienne:wght@400;700;900&family=Rye&family=Bevan&family=Sancreek&display=swap" rel="stylesheet">
<style>
/* Mockup only. One hero, five type pairings; Verdigris colors throughout. */
:root { --cast: #151A1A; --sand: #1F2726; --edge: #070909; --bright: #EEF0EC; --pewter: #A7B2AE; --rule: #2B3533; --copper: #E8834D; --copper-edge: #9A4B22; --verdigris: #4FB3A0; }
* { box-sizing: border-box; }
body { margin: 0; background: #0C1010; color: var(--bright); padding: 24px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1500px; margin: 0 auto; }
.panel { background: var(--cast); padding: 32px 36px 36px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px 32px; }
.tag { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 12px; font: 600 14px/1.3 Archivo, sans-serif; color: var(--pewter); }
.tag b { color: var(--bright); font-size: 16px; }
h1 { font-family: var(--d); font-weight: var(--dw, 700); font-stretch: var(--ds, 100%); font-size: var(--dsize, 68px); line-height: .98; letter-spacing: var(--dt, -.01em); margin: 8px 0 0; }
.lede { font-family: var(--b); font-size: 20px; line-height: 1.4; color: var(--pewter); margin: 14px 0 20px; }
.btn { display: inline-block; font-family: var(--l); font-weight: 700; font-stretch: var(--ls, 100%); font-size: var(--lsize, 15px); letter-spacing: var(--lt, 0); text-decoration: none; padding: 11px 18px 9px; border-radius: 6px; background: var(--copper); color: var(--cast); border: 1px solid var(--copper-edge); border-bottom-width: 4px; }
dl { margin: 6px 0 0; }
dl div { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--rule); }
dt { font-family: var(--l); font-stretch: var(--ls, 100%); font-size: var(--lsize, 14px); letter-spacing: var(--lt, 0); color: var(--pewter); }
dd { margin: 0; font-family: var(--l); font-stretch: var(--ls, 100%); font-weight: 700; font-size: calc(var(--lsize, 14px) + 2px); letter-spacing: var(--lt, 0); font-variant-numeric: tabular-nums; }
.key { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1.6fr; gap: 24px; align-items: start; padding: 16px 18px 18px; border-radius: 8px; background: var(--sand); border: 1px solid var(--edge); border-bottom-width: 5px; }
.key h2 { font-family: var(--d2, var(--d)); font-weight: var(--dw, 700); font-stretch: var(--ds, 100%); font-size: calc(var(--dsize, 68px) * .42); line-height: 1.05; margin: 0; letter-spacing: var(--dt, -.01em); }
.key p { font-family: var(--b); font-size: 16px; line-height: 1.5; color: var(--pewter); margin: 0; }
.note { grid-column: 1 / -1; font: 400 14px/1.45 Archivo, sans-serif; color: var(--pewter); margin: 0; }
.p0 { --d: Archivo; --ds: 118%; --dw: 750; --b: "Source Serif 4"; --l: Archivo; --ls: 112%; --dt: -.02em; }
.p1 { --d: "Grenze Gotisch"; --dw: 700; --dsize: 80px; --dt: 0; --b: Alegreya; --l: "Alegreya Sans"; }
.p2 { --d: "Big Shoulders Display"; --dw: 900; --dsize: 84px; --dt: .01em; --b: "Source Serif 4"; --l: "Big Shoulders Text"; --lsize: 16px; --lt: .02em; }
.p3 { --d: Marcellus; --dw: 400; --dsize: 66px; --dt: .01em; --b: Alegreya; --l: "Marcellus SC"; --lt: .03em; }
.p5 { --d: Grenze; --dw: 700; --dsize: 72px; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.p6 { --d: "Pirata One"; --dw: 400; --dsize: 78px; --dt: .01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p7 { --d: UnifrakturMaguntia; --dw: 400; --dsize: 74px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p8 { --d: "Jacquard 24"; --dw: 400; --dsize: 84px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.p9 { --d: "Uncial Antiqua"; --dw: 400; --dsize: 60px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.p10 { --d: "IM Fell English"; --dw: 400; --dsize: 72px; --dt: -.01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p11 { --d: Almendra; --dw: 700; --dsize: 70px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.p12 { --d: UnifrakturCook; --dw: 700; --dsize: 72px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p13 { --d: "New Rocker"; --dw: 400; --dsize: 74px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p14 { --d: "Jacquard 12"; --dw: 400; --dsize: 84px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.p15 { --d: "Jacquarda Bastarda 9"; --dw: 400; --dsize: 72px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.p16 { --d: "IM Fell French Canon"; --dw: 400; --dsize: 72px; --dt: -.01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p17 { --d: "IM Fell DW Pica"; --dw: 400; --dsize: 72px; --dt: -.01em; --b: "IM Fell DW Pica"; --l: "Barlow Condensed"; --lsize: 16px; }
.p18 { --d: "Goudy Bookletter 1911"; --dw: 400; --dsize: 72px; --dt: -.01em; --b: "Sorts Mill Goudy"; --l: "Barlow Condensed"; --lsize: 16px; }
.p19 { --d: "Sorts Mill Goudy"; --dw: 400; --dsize: 72px; --dt: -.01em; --b: "Sorts Mill Goudy"; --l: "Barlow Condensed"; --lsize: 16px; }
.p20 { --d: "Pirata One"; --d2: "IM Fell English"; --dw: 400; --dsize: 78px; --dt: .01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.p21 { --d: "Jacquard 24"; --d2: "IM Fell English"; --dw: 400; --dsize: 84px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q1 { --d: Fruktur; --dw: 400; --dsize: 70px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q2 { --d: Blaka; --dw: 400; --dsize: 76px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q3 { --d: "Jacquard 24 Charted"; --dw: 400; --dsize: 84px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.q4 { --d: "Metal Mania"; --dw: 400; --dsize: 74px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q5 { --d: Caudex; --dw: 700; --dsize: 70px; --dt: -.01em; --b: Caudex; --l: "Barlow Condensed"; --lsize: 16px; }
.q6 { --d: "Brygada 1918"; --dw: 700; --dsize: 70px; --dt: -.01em; --b: "Brygada 1918"; --l: "Barlow Condensed"; --lsize: 16px; }
.q7 { --d: Fondamento; --dw: 400; --dsize: 70px; --dt: 0; --b: Alegreya; --l: "Barlow Condensed"; --lsize: 16px; }
.q8 { --d: "IM Fell Great Primer"; --dw: 400; --dsize: 72px; --dt: -.01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q9 { --d: Tienne; --dw: 900; --dsize: 66px; --dt: -.01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q10 { --d: Rye; --dw: 400; --dsize: 58px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q11 { --d: Bevan; --dw: 400; --dsize: 62px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q12 { --d: Sancreek; --dw: 400; --dsize: 70px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q13 { --d: UnifrakturCook; --d2: "IM Fell English"; --dw: 700; --dsize: 72px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q14 { --d: "Jacquard 12"; --d2: "IM Fell English"; --dw: 400; --dsize: 84px; --dt: 0; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
.q15 { --d: "Pirata One"; --d2: "Goudy Bookletter 1911"; --dw: 400; --dsize: 78px; --dt: .01em; --b: "Sorts Mill Goudy"; --l: "Barlow Condensed"; --lsize: 16px; }
.p4 { --d: Texturina; --dw: 700; --dsize: 70px; --dt: -.01em; --b: "EB Garamond"; --l: "Barlow Condensed"; --lsize: 16px; }
</style>
</head>
<body>
<div class="grid">
<script>
// #set2 shows the second round (between A and D).
const SET1 = [
  ['p0', 'Current', 'Archivo + Source Serif 4', 'Clean and modern; reads as engineering, not forge.'],
  ['p1', 'A. The smithy', 'Grenze Gotisch + Alegreya', 'Blackletter headline, like a guild mark struck into iron. Most medieval; body stays easy to read.'],
  ['p2', 'B. The foundry floor', 'Big Shoulders Display + Source Serif 4', 'Tall, heavy industrial capitals cut from steel-mill signage. Loud, physical, modern.'],
  ['p3', 'C. The forged plaque', 'Marcellus + Alegreya', 'Flared Roman letters, like an engraved maker\'s plate. Epic but calm, closest to the logo.'],
  ['p4', 'D. The armorer\'s book', 'Texturina + EB Garamond', 'Gothic-Roman hybrid with an old-book body. Story-like, medieval without full blackletter.'],
];
const SET2 = [
  ['p1', 'A. The smithy (reference)', 'Grenze Gotisch + Alegreya', 'Round-one blackletter, for comparison.'],
  ['p4', 'D. The armorer\'s book (reference)', 'Texturina + EB Garamond', 'Round-one hybrid, for comparison.'],
  ['p5', 'E. Grenze', 'Grenze + Alegreya', 'Same family as A, but Roman shapes with blackletter edges. Halfway between A and D.'],
  ['p6', 'F. Pirata One', 'Pirata One + EB Garamond', 'Bold, compact blackletter with simplified capitals; reads more easily than true fraktur.'],
  ['p7', 'G. Unifraktur Maguntia', 'UnifrakturMaguntia + EB Garamond', 'Classic German fraktur, the most authentic old-world blackletter. Hardest to read.'],
  ['p8', 'H. Jacquard 24', 'Jacquard 24 + Alegreya', 'Square-cut textura blackletter designed on a woven grid; at headline size it reads as crisp, upright blackletter. Readable caps.'],
  ['p9', 'I. Uncial Antiqua', 'Uncial Antiqua + Alegreya', 'Early-medieval Celtic uncial; feels like dwarven runes on a forge door.'],
  ['p10', 'J. IM Fell English', 'IM Fell English + EB Garamond', 'A 17th-century printing type with ink-pressed edges; a smith\'s ledger, quiet and story-like.'],
  ['p11', 'K. Almendra', 'Almendra + Alegreya', 'Calligraphic book hand with sharp pen strokes; storybook epic, softer than blackletter.'],
];
const SET3 = [
  ['p6', 'F. Pirata One (your pick)', 'Pirata One + EB Garamond', 'Reference.'],
  ['p8', 'H. Jacquard 24 (your pick)', 'Jacquard 24 + Alegreya', 'Reference.'],
  ['p10', 'J. IM Fell English (your pick)', 'IM Fell English + EB Garamond', 'Reference.'],
  ['p20', 'F + J combined', 'Pirata One headline, IM Fell English headings', 'One blackletter moment; every other heading stays letterpress and easy to read.'],
  ['p21', 'H + J combined', 'Jacquard 24 headline, IM Fell English headings', 'Same idea with the square blackletter.'],
  ['p12', 'L. Unifraktur Cook', 'UnifrakturCook + EB Garamond', 'Heavy, inky fraktur, like F with more weight and swash. Near F.'],
  ['p13', 'M. New Rocker', 'New Rocker + EB Garamond', 'Blackletter with sharp, modern cuts; edgier and more rock than F. Near F.'],
  ['p14', 'N. Jacquard 12', 'Jacquard 12 + Alegreya', 'Same family as H on a coarser grid; the stepped pixel edges show. Near H.'],
  ['p15', 'O. Jacquarda Bastarda 9', 'Jacquarda Bastarda 9 + Alegreya', 'Pixel-grid bastarda, a looser medieval hand; looks like an old loom or bitmap. Near H.'],
  ['p16', 'P. IM Fell French Canon', 'IM Fell French Canon + EB Garamond', 'Larger cut of the Fell types: bolder, more ink spread. Near J.'],
  ['p17', 'Q. IM Fell DW Pica', 'IM Fell DW Pica throughout', 'The Fell text cut used for everything; the whole page reads like an old printed ledger. Near J.'],
  ['p18', 'R. Goudy Bookletter 1911', 'Goudy Bookletter 1911 + Sorts Mill Goudy', 'Arts and Crafts era letterpress (1911); hand-made printing, warmer than Fell. Near J.'],
  ['p19', 'S. Sorts Mill Goudy', 'Sorts Mill Goudy throughout', 'Classic Goudy old style with a slightly rough edge; bookish and calm. Near J.'],
];
const SET4 = [
  ['q1', '1. Fruktur', 'Fruktur + EB Garamond', 'Blackletter. Rounded, bouncy fraktur; friendlier and more playful than F.'],
  ['q2', '2. Blaka', 'Blaka + EB Garamond', 'Blackletter. Contemporary blackletter with Arabic calligraphy roots; flat, sharp, unusual.'],
  ['q3', '3. Jacquard 24 Charted', 'Jacquard 24 Charted + Alegreya', 'Blackletter. H drawn on its visible grid, like a loom chart or a keycap legend matrix.'],
  ['q4', '4. Metal Mania', 'Metal Mania + EB Garamond', 'Blackletter. Heavy-metal band lettering; very loud, and reads as music more than craft.'],
  ['q5', '5. Caudex', 'Caudex throughout', 'Manuscript. Based on medieval book hands; sturdy, readable, quietly old-world.'],
  ['q6', '6. Brygada 1918', 'Brygada 1918 throughout', 'Book type. A revived 1918 Polish typeface; strong, historic, slightly rough.'],
  ['q7', '7. Fondamento', 'Fondamento + Alegreya', 'Manuscript. Broad-pen calligraphy, like a scribe\'s title page.'],
  ['q8', '8. IM Fell Great Primer', 'IM Fell Great Primer + EB Garamond', 'Letterpress. Another Fell cut, a touch more refined than J.'],
  ['q9', '9. Tienne Black', 'Tienne 900 + EB Garamond', 'Book type. Heavy old-style with chunky serifs; a hammered, forged weight.'],
  ['q10', '10. Rye', 'Rye + EB Garamond', 'Wood type. 19th-century poster lettering with spurs; reads Western.'],
  ['q11', '11. Bevan', 'Bevan + EB Garamond', 'Wood type. Heavy slab serif, like a cast-iron foundry sign.'],
  ['q12', '12. Sancreek', 'Sancreek + EB Garamond', 'Wood type. Ornate Victorian poster face; strongly Western.'],
  ['q13', '13. L + J', 'Unifraktur Cook headline, IM Fell English headings', 'Combination: heavier fraktur headline, letterpress headings.'],
  ['q14', '14. N + J', 'Jacquard 12 headline, IM Fell English headings', 'Combination: pixel-edged blackletter headline, letterpress headings. The keyboard nod.'],
  ['q15', '15. F + R', 'Pirata One headline, Goudy Bookletter headings', 'Combination: blackletter headline, warm Arts and Crafts letterpress for the rest.'],
];
const P = location.hash === '#set4' ? SET4 : location.hash === '#set3' ? SET3 : location.hash === '#set2' ? SET2 : SET1;
document.write(P.map(([c, name, fonts, note]) => `
<section class="panel ${c}">
  <div class="tag"><b>${name}</b><span>${fonts}</span></div>
  <div>
    <h1>Forged by night.</h1>
    <p class="lede">After dark, the forge is lit and a keyboard is made.</p>
    <a class="btn" href="#">Request a Commission</a>
  </div>
  <dl>
    <div><dt>Layout</dt><dd>75%</dd></div>
    <div><dt>Mount</dt><dd>Gasket</dd></div>
    <div><dt>Build window</dt><dd>2–5 weeks</dd></div>
    <div><dt>Starting budget</dt><dd>From $250</dd></div>
  </dl>
  <div class="key"><h2>What I refuse to rush.</h2><p>I begin with how the finished object should feel, sound, function and live on your desk, then choose components around that goal.</p></div>
  <p class="note">${note}</p>
</section>`).join(''));
</script>
</div>
</body>
</html>
